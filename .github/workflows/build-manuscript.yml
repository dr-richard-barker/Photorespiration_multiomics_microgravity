name: Build manuscript

on:
  push:
    paths:
      - 'manuscript/latex/**'
      - '.github/workflows/build-manuscript.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile with latexmk
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: manuscript/latex
          root_file: main.tex
          latexmk_use_xelatex: false

      - name: Publish the PDF to the Pages site
        run: |
          mkdir -p docs
          cp manuscript/latex/main.pdf docs/Photorespiration_multiomics_microgravity.pdf

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Rebuild manuscript PDF [skip ci]'
          file_pattern: docs/*.pdf
